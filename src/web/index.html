<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Quarker Web</title>
    <link rel="stylesheet" href="styles.css">
    <script src="assets/quarker.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero" aria-label="Quarker header">
        <p class="brandline">~ SQUIDPONY ~</p>
        <h1>Quarker</h1>
        <p class="lede">Browser edition compiled from the Java codebase with TeaVM.</p>
        <div class="meta-row">
          <p id="status" class="status">Preparing...</p>
          <p class="build-tag">Open-source self-hosted build</p>
        </div>
      </header>

      <section class="console-panel" aria-label="Quarker game screen">
        <div class="panel-head">
          <span class="panel-title">Game Console</span>
          <span class="panel-subtitle">Keyboard commands active</span>
        </div>
        <pre id="quarker-screen" class="console"></pre>
      </section>

      <p class="note">Controls: h j k l y u b n, ., &lt;, &gt;, s, p, V, esc</p>
    </main>
  </body>
</html>
